exec-once=kwalletd6
exec-once=zlaunch
exec-once=vibepanel
exec-once=awww-daemon
exec-once=kdeconnectd
exec-once=dex -a # Run all autostart apps in ~/.config/autostart and /etc/xdg/autostart/exec-once=wl-paste --type text --watch cliphist store
