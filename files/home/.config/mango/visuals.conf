#####################
# STYLING
#####################

# Colors
bordercolor=0xd4be98ff
focuscolor=0x7daea3ff

rootcolor=0x1d1a16ff
maximizescreencolor=0x7daea3ff
urgentcolor=0xea6962ff
scratchpadcolor=0xfe8019ff
globalcolor=0xb16286ff
overlaycolor=0x3c3836cc


# Cursor
env=XCURSOR_SIZE,24
cursor_size=24
env=XCURSOR_THEME,Bibata-Original-Gruvbox
cursor_theme=Bibata-Original-Gruvbox


# Animations
tag_animation_direction=0

# Window effects
blur=1
blur_layer=1
blur_optimized=1
blur_params_radius=8
blur_params_num_passes=2
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2

shadows=1
layer_shadows=1
shadow_only_floating=1
shadows_size=12
shadows_blur=25
shadows_position_x=0
shadows_position_y=0
shadowscolor=0x000000ff

border_radius=10

focused_opacity=0.90
unfocused_opacity=0.75